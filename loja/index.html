<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Só roda código do próprio site; só fala com o servidor do Saus360; imagens só do próprio site e do armazenamento das lojas -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://yawimfjkcntexqantjgy.supabase.co; font-src 'self'; connect-src https://yawimfjkcntexqantjgy.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Loja online · Saus360</title>
<meta name="description" content="Faça seu pedido online: escolha os produtos, a data de retirada ou entrega e envie.">
<meta name="theme-color" content="#FFFFFF">
<meta property="og:title" content="Faça seu pedido online">
<meta property="og:description" content="Escolha os produtos, a data de retirada ou entrega e envie o pedido.">
<link rel="icon" type="image/svg+xml" href="/app/icons/icon.svg">
<link rel="preload" href="/fonts/fraunces-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Hallmark · shape: app screen · genre: playful · theme: brand · redesign: restyle
 * paper: oklch(99.7% 0.003 60) · accent: the store's own colour (framboesa by default) · display: Fraunces · body: Manrope
 * nav: kept (search and section tabs) · signature: the awning cover, the store's colour and the round price sticker · states: loading, empty, error, full
 * axes: warm-white/serif-head/store-colour · posture: kept · contrast: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H4 E4 S4 R4 V3 · weakest: V, a storefront has a fixed anatomy (cover, menu, bag); each store differs by its own colour, logo and photos */
/* Hallmark · answered F23 · each store page gets its title from the store's name at load */
/* Hallmark · waive 24b · spacing kept from the existing store layout · a restyle keeps the storefront spacing customers already order through */
/* Fraunces: SIL Open Font License 1.1 */
@font-face{font-family:"Fraunces";font-weight:600;font-display:swap;src:url(/fonts/fraunces-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-weight:500;font-display:swap;src:url(/app/fonts/manrope-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-weight:700;font-display:swap;src:url(/app/fonts/manrope-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-weight:800;font-display:swap;src:url(/app/fonts/manrope-latin-800-normal.woff2) format("woff2")}
/* Cores: a cor de destaque vem do tema que a loja escolheu (o JS troca --acc, --acc-d e --acc-soft) */
:root{--ink:#2A2530;--ink2:#625B69;--bg:#FFFEFC;--surf:#F7F3F1;--line:#ECE6E5;--acc:#B5285A;--acc-d:#8F1D46;--acc-soft:#FCEBF1;--on-acc:#FFFDFB;
  --ok:#1F7A55;--ok-d:#18643F;--ok-soft:#E3F4EC;--bad:#B3261E;--bad-soft:#FDECEA;--sol:#FFD166;--sol-ink:#3A2A00;--mask:#000;--esq-2:#ECE7E6;
  --veu:color-mix(in srgb,#FFFEFC 94%,transparent);--veu-acc:color-mix(in srgb,#FFFFFF 20%,transparent);--pontos:color-mix(in srgb,#FFFFFF 16%,transparent);
  --escuro:color-mix(in srgb,#18121A 82%,transparent);--scrim:color-mix(in srgb,#18121A 50%,transparent);
  --sombra:0 3px 10px -2px color-mix(in srgb,#2A2530 35%,transparent);--sombra-s:0 1px 0 color-mix(in srgb,#2A2530 5%,transparent),0 14px 30px -20px color-mix(in srgb,#2A2530 45%,transparent);
  --display:"Fraunces",Georgia,serif;--txt:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--r:18px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;overflow-x:clip}
body{margin:0;font:500 16px/1.5 var(--txt);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;padding-bottom:104px;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3,p{margin:0}
s{text-decoration-thickness:1.5px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:10px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
.muted{color:var(--ink2)}
.isca{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
[hidden]{display:none!important}
.fundo.sem,.fundo.sem .folha{animation:none}

/* Fachada: a capa termina em ondas, como o toldo de uma confeitaria */
.capa{--o:13px;height:clamp(150px,40vw,300px);background:var(--acc);position:relative;
  -webkit-mask:radial-gradient(var(--o) at 50% calc(100% - var(--o)),var(--mask) 97%,transparent) 50% 100%/calc(2*var(--o)) calc(2*var(--o)) repeat-x,linear-gradient(var(--mask) 0 0) top/100% calc(100% - var(--o)) no-repeat;
  mask:radial-gradient(var(--o) at 50% calc(100% - var(--o)),var(--mask) 97%,transparent) 50% 100%/calc(2*var(--o)) calc(2*var(--o)) repeat-x,linear-gradient(var(--mask) 0 0) top/100% calc(100% - var(--o)) no-repeat}
.capa img{width:100%;height:100%;object-fit:cover}
.capa.lisa{height:clamp(104px,22vw,170px);background:var(--acc) radial-gradient(circle at 12px 12px,var(--pontos) 2.5px,transparent 3px) 0 0/24px 24px}
.topo{position:relative;padding-bottom:6px}
.topo .linha{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:-50px;position:relative}
.logo{width:96px;height:96px;border-radius:50%;border:4px solid var(--bg);background:var(--acc-soft);color:var(--acc-d);display:grid;place-items:center;font:600 34px/1 var(--display);overflow:hidden;box-shadow:var(--sombra);flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.acoes{display:flex;gap:8px;padding-bottom:4px}
.acoes a,.acoes button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);display:grid;place-items:center;color:var(--ink);text-decoration:none;padding:0;transition:background-color .12s,transform .12s}
.acoes a:hover,.acoes button:hover{background:var(--surf)}
.acoes a:active,.acoes button:active{transform:scale(.94)}
.acoes .wa{background:var(--ok);border-color:var(--ok);color:var(--on-acc)}
.acoes .wa:hover{background:var(--ok-d)}
.acoes svg{width:21px;height:21px}
.topo h1{font:600 clamp(30px,7vw,46px)/1.06 var(--display);letter-spacing:-.015em;margin-top:12px;text-wrap:balance}
.topo .bio{margin-top:8px;color:var(--ink2);max-width:60ch;font-size:16.5px;white-space:pre-line}
/* Como a loja atende: uma ficha, nada cortado pela borda */
.fatos{list-style:none;margin:18px 0 0;padding:6px 16px;background:var(--surf);border-radius:20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.fatos li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;min-width:0}
.fatos svg{width:20px;height:20px;color:var(--acc);flex:none;margin-top:3px}
.fatos small{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);line-height:1.3}
.fatos b{display:block;font-size:14.5px;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
@media (max-width:359px){.fatos{grid-template-columns:1fr}}
@media (min-width:900px){
  .topo .corpo{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:40px;align-items:start}
  .fatos{grid-template-columns:1fr;margin-top:22px;padding:4px 20px}
  .fatos li{padding:12px 0}
  .fatos li+li{border-top:1px solid var(--line)}
}
.fita{display:flex;align-items:center;gap:10px;background:var(--acc);color:var(--on-acc);border-radius:16px;padding:13px 16px;font-weight:800;font-size:15.5px;line-height:1.35;margin-top:16px}
.fita svg{width:22px;height:22px;flex:none}

/* Navegação: busca e seções */
.nav{position:sticky;top:0;z-index:5;background:var(--veu);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-top:16px}
.busca{position:relative;padding-top:10px}
.busca svg{position:absolute;left:13px;top:22px;width:19px;height:19px;color:var(--ink2);pointer-events:none}
.busca input{width:100%;border:0;border-radius:14px;background:var(--surf);padding:11px 14px 11px 40px;font-size:16px;font-weight:500}
.busca input:focus{outline:2px solid var(--acc)}
.abas{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 14px}
.abas::-webkit-scrollbar{display:none}
.abas button{flex:none;border:0;background:none;padding:13px 8px 11px;font-weight:700;font-size:15px;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap;transition:color .12s}
.abas button:hover{color:var(--ink)}
.abas button[aria-current=true]{color:var(--ink);border-bottom-color:var(--acc)}

/* Seções */
.sec{scroll-margin-top:118px;padding-top:26px}
.sec>header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec h2{font:600 25px/1.15 var(--display);letter-spacing:-.01em}
.sec header small{color:var(--ink2);font-size:14px;font-weight:700;white-space:nowrap}
.trilho{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-left:18px;margin:0 -18px;padding:2px 18px 10px;scrollbar-width:none}
.trilho::-webkit-scrollbar{display:none}
.trilho>*{scroll-snap-align:start;flex:none}
.grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}
@media (min-width:700px){.grade{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 18px}}
@media (min-width:980px){.grade{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* Produto */
.prod{position:relative;min-width:0}
.trilho .prod{width:158px}
.pw{position:relative}
.pfoto{display:block;width:100%;aspect-ratio:1;border:0;padding:0;border-radius:var(--r);overflow:hidden;background:var(--surf)}
.pfoto img,.dfoto img{width:100%;height:100%;object-fit:cover}
@media (hover:hover){.pfoto:hover,.dfoto:hover{box-shadow:0 0 0 3px var(--acc-soft)}}
/* sem foto: o bolo desenhado no tom da loja, nunca iniciais */
.ph{width:100%;height:100%;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.ph svg{width:42%;height:42%;max-width:96px;max-height:96px}
.ptx{padding:9px 2px 0}
.ptx h3{font:700 15.5px/1.3 var(--txt);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ptx p{color:var(--ink2);font-size:13.5px;line-height:1.35;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{font-weight:800;font-size:16px;margin-top:5px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 7px}
.pr small{font-weight:700;color:var(--ink2);font-size:13px}
.pr s{font-weight:700;color:var(--ink2);font-size:13.5px}
.pr.promo>b{color:var(--acc-d)}
.pronta{display:inline-flex;align-items:center;gap:5px;color:var(--ok);font-size:12.5px;font-weight:800;margin-top:3px}
.pronta::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
/* etiqueta redonda de preço, como as coladas na vitrine */
.stk{position:absolute;top:-7px;left:-7px;min-width:50px;height:50px;padding:0 6px;border-radius:50%;background:var(--sol);color:var(--sol-ink);display:grid;place-items:center;font-weight:800;font-size:14.5px;transform:rotate(-10deg);box-shadow:var(--sombra);pointer-events:none;z-index:1}
.selo{position:absolute;left:8px;bottom:8px;background:var(--veu);color:var(--ink);font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;pointer-events:none}
.ctl{position:absolute;right:8px;bottom:8px;z-index:1}
.mais{width:42px;height:42px;border-radius:50%;border:0;background:var(--bg);color:var(--acc-d);display:grid;place-items:center;box-shadow:var(--sombra);padding:0;transition:transform .12s}
.mais:hover{transform:scale(1.06)}
.mais:active{transform:scale(.94)}
.mais svg{width:20px;height:20px}
.step{display:flex;align-items:center;background:var(--acc);color:var(--on-acc);border-radius:999px;box-shadow:var(--sombra)}
.step button{width:38px;height:40px;border:0;background:none;color:var(--on-acc);font-size:21px;font-weight:700;line-height:1;padding:0;border-radius:999px}
.step output{min-width:20px;text-align:center;font-weight:800;font-size:15px}

/* Destaques do dia: cartões altos */
.dest{position:relative;width:min(64vw,250px)}
.dfoto{display:block;width:100%;aspect-ratio:4/5;border:0;padding:0;border-radius:22px;overflow:hidden;position:relative;background:var(--acc-soft);text-align:left}
.dfoto::after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(transparent,var(--escuro))}
.dtx{position:absolute;left:14px;right:62px;bottom:13px;color:var(--on-acc);z-index:1;display:flex;flex-direction:column;gap:3px}
.dtx b{font:600 20px/1.15 var(--display);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dtx span{font-weight:800;font-size:15.5px}
.dtx s{font-weight:700;opacity:.8;font-size:13.5px;margin-left:5px}
.dest .ctl{right:12px;bottom:12px}
.dest .stk{top:10px;left:10px}

/* Combos */
.combo{position:relative;width:min(84vw,340px);border:1.5px solid var(--line);border-radius:20px;background:var(--bg);transition:border-color .12s}
.combo:hover{border-color:var(--acc-soft)}
.cbody{display:flex;gap:13px;width:100%;border:0;background:none;padding:12px 12px 12px;text-align:left;border-radius:20px;align-items:stretch}
.cfoto{width:98px;height:98px;border-radius:14px;overflow:hidden;flex:none;background:var(--acc-soft);color:var(--acc-d)}
.cfoto img{width:100%;height:100%;object-fit:cover}
.cfoto .ph{font-size:28px}
.ctx{display:flex;flex-direction:column;min-width:0;flex:1;padding-right:2px}
.ctx b{font-size:16px;line-height:1.25}
.ctx small{color:var(--ink2);font-size:13.5px;line-height:1.35;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ctx .pr{margin-top:auto;padding-top:6px}
.econ{display:inline-block;background:var(--sol);color:var(--sol-ink);font-weight:800;font-size:12.5px;padding:3px 9px;border-radius:999px}
.combo .ctl{right:10px;bottom:10px}
.combo .mais{background:var(--acc);color:var(--on-acc);box-shadow:none}

/* Barra da sacola */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--veu) 32%)}
.barra button{width:100%;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;border:0;border-radius:18px;background:var(--acc);color:var(--on-acc);padding:13px 18px 13px 14px;font-weight:800;font-size:16.5px;text-align:left;box-shadow:0 12px 26px -12px var(--acc-d)}
.barra button:hover{background:var(--acc-d)}
.barra .n{min-width:34px;height:34px;border-radius:50%;background:var(--veu-acc);display:grid;place-items:center;font-size:15px;padding:0 6px}
.barra .t{flex:1;display:flex;flex-direction:column;line-height:1.25}
.barra .t small{font-weight:700;font-size:12.5px;opacity:.9}
.barra.pulo button{animation:pulo .28s ease}
@keyframes pulo{40%{transform:scale(1.03)}}

/* Folhas */
.fundo{position:fixed;inset:0;background:var(--scrim);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:surge .18s ease}
.folha{background:var(--bg);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));position:relative;animation:sobe .24s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
@keyframes surge{from{opacity:0}}
@keyframes sobe{from{transform:translateY(40px);opacity:.6}}
@media (min-width:700px){.fundo{align-items:center}.folha{border-radius:26px;max-height:88vh}}
.folha h2{font:600 26px/1.15 var(--display);margin:2px 48px 6px 0}
.fechar{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;border:0;background:var(--surf);display:grid;place-items:center;padding:0;z-index:2}
.fechar svg{width:20px;height:20px}
.folha .grande{width:calc(100% + 36px);margin:-20px -18px 16px;aspect-ratio:4/3;object-fit:cover;background:var(--surf);max-width:none}
.folha .grande.ph{aspect-ratio:5/2;font-size:44px}
.folha .grande+.fechar,.temfoto .fechar{background:var(--veu)}
.desc{color:var(--ink2);margin-top:8px;white-space:pre-line}
.alerg{font-size:14px;color:var(--ink2);margin-top:10px;background:var(--surf);border-radius:12px;padding:9px 12px}
.oque{list-style:none;padding:0;margin:12px 0 0;border:1.5px solid var(--line);border-radius:14px}
.oque li{display:flex;gap:10px;padding:10px 13px;border-bottom:1px solid var(--line);font-weight:700}
.oque li:last-child{border-bottom:0}
.oque li span{color:var(--acc-d);font-weight:800;min-width:34px}
.passo{display:flex;align-items:center;gap:6px;background:var(--surf);border-radius:14px;padding:4px}
.passo button{width:44px;height:44px;border-radius:11px;border:0;background:var(--bg);font-size:22px;font-weight:700;line-height:1;padding:0}
.passo output{min-width:44px;text-align:center;font-weight:800;font-size:18px}
.add{margin-top:18px;display:flex;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 20px;border-radius:16px;border:0;background:var(--acc);color:var(--on-acc);font-weight:800;font-size:16px;text-decoration:none;flex:1;transition:background-color .12s,transform .12s}
.btn:active{transform:scale(.98)}
.btn:hover{background:var(--acc-d)}
.btn.linha{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.btn.linha:hover{background:var(--surf)}
.btn.wa{background:var(--ok)}
.btn.wa:hover{background:var(--ok-d)}
.btn[disabled]{background:var(--surf);color:var(--ink2);border-color:var(--line);cursor:not-allowed}
.btn.cheio{width:100%;margin-top:16px}
.btn svg{width:20px;height:20px}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item .mini{width:52px;height:52px;border-radius:12px;overflow:hidden;flex:none;background:var(--surf)}
.item .mini img{width:100%;height:100%;object-fit:cover}
.item .mini .ph{font-size:17px}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-size:15.5px;line-height:1.3}
.item .nm small{color:var(--ink2);font-weight:700}
.item .passo button{width:34px;height:34px;font-size:18px;border-radius:9px}
.item .passo output{min-width:28px;font-size:15.5px}
.tot{display:flex;justify-content:space-between;padding:5px 0;font-size:15.5px}
.tot.menos{color:var(--ok);font-weight:700}
.tot.big{font-weight:800;font-size:20px;padding-top:10px;margin-top:6px;border-top:1.5px solid var(--line)}
.lbl{display:block;font-weight:800;font-size:14px;margin:18px 0 8px}
.campo{display:block;margin-top:12px;font-weight:700;font-size:14.5px}
.campo input,.campo textarea{display:block;width:100%;margin-top:6px;border:1.5px solid var(--line);border-radius:13px;padding:13px 14px;background:var(--bg);font-weight:500;font-size:16px}
.campo input:focus,.campo textarea:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc-soft)}
.campo.erro input,.campo.erro textarea{border-color:var(--bad)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--surf);padding:5px;border-radius:15px}
.seg button{border:0;background:none;border-radius:11px;padding:11px 6px;font-weight:800;font-size:15px;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:var(--sombra-s)}
.dias{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:2px 18px 4px;scrollbar-width:none}
.dias::-webkit-scrollbar{display:none}
.dias button{flex:none;min-width:64px;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;line-height:1.2;font-weight:800;font-size:17px}
.dias button small{font-size:12px;font-weight:700;color:var(--ink2);text-transform:capitalize}
.dias button[aria-pressed=true]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc-d)}
.dias button[aria-pressed=true] small{color:var(--acc-d)}
.dias .outra{font-size:14px;justify-content:center}
.aviso{background:var(--acc-soft);color:var(--acc-d);border-radius:13px;padding:12px 14px;font-size:14.5px;font-weight:700;margin-top:14px}
.aviso.erro{background:var(--bad-soft);color:var(--bad)}
.nota{font-size:14px;color:var(--ink2);margin-top:10px}
.volta{border:0;background:none;padding:6px 0;font-weight:800;color:var(--acc-d);display:inline-flex;align-items:center;gap:4px;margin-bottom:2px}
.ok{text-align:center;padding:10px 0}
.ok .sel{width:76px;height:76px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:6px auto 12px}
.ok .sel svg{width:40px;height:40px}
.ok h2{margin:0 0 6px}
.resumo{text-align:left;background:var(--surf);border-radius:14px;padding:14px;margin:14px 0;white-space:pre-line;font-size:15px}
.estado{text-align:center;padding:90px 20px 40px;max-width:520px;margin:0 auto}
.estado h1{font:600 32px/1.15 var(--display);margin:0 0 10px}
.vazio{text-align:center;padding:44px 10px;color:var(--ink2)}
.vazio b{display:block;font:600 22px/1.2 var(--display);color:var(--ink);margin-bottom:6px}
.esq{background:linear-gradient(90deg,var(--surf),var(--esq-2),var(--surf));background-size:200% 100%;animation:esq 1.2s linear infinite;border-radius:18px}
@keyframes esq{to{background-position:-200% 0}}
.rodape{text-align:center;padding:28px 18px 20px;font-size:13.5px;color:var(--ink2)}
.rodape a{font-weight:800;text-underline-offset:4px}
.brinde{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:700;font-size:14.5px;padding:10px 16px;border-radius:999px;z-index:40;pointer-events:none;animation:surge .2s ease;white-space:nowrap}
/* Computador: destaques, combos e promoções em grade, sem rolar de lado */
@media (min-width:980px){
  .trilho{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 18px;overflow:visible;margin:0;padding:2px 0 10px}
  .trilho>.combo{grid-column:span 2}
  .dest,.combo,.trilho .prod{width:auto}
  .sec{padding-top:36px}
  .sec h2{font-size:30px}
}
/* Como fazer seu pedido */
.como{margin-top:48px;background:var(--acc-soft);border-radius:28px;padding:24px 20px}
.como h2,.sobre h2{font:600 26px/1.15 var(--display);letter-spacing:-.01em}
.como ol{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:14px;counter-reset:passo}
.como li{counter-increment:passo;display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:12px;align-items:start}
.como li::before{content:counter(passo);grid-row:1/3;width:40px;height:40px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-weight:800;font-size:17px}
.como li b{font-size:16.5px;line-height:1.3;padding-top:1px}
.como li span{color:var(--ink2);font-size:15px;line-height:1.4}
@media (min-width:760px){.como{padding:30px 32px}.como ol{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}}
/* Sobre a loja */
.sobre{margin-top:18px;border:1.5px solid var(--line);border-radius:28px;padding:22px 20px}
.sobre-id{display:flex;gap:14px;align-items:center}
.sobre-id p{margin-top:4px;font-size:15px;white-space:pre-line}
.logo.pequena{width:64px;height:64px;border-width:3px;font-size:24px;box-shadow:none;border-color:var(--surf)}
.dados{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.dados li{display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:15px}
.dados svg{width:20px;height:20px;color:var(--acc);flex:none;margin-top:1px}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.links .btn{flex:1 1 100%;min-height:48px;font-size:15px;padding:0 18px}
@media (min-width:480px){.links .btn{flex:0 1 auto}}
@media (min-width:760px){.sobre{padding:26px 32px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:32px;align-items:center}.sobre .dados{grid-column:1}.sobre .links{grid-column:2;grid-row:1/3;margin:0;flex-direction:column}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
