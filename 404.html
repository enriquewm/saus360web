<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loja online · Saus360</title>
<meta name="description" content="Faça seu pedido online: escolha os produtos, a data de retirada ou entrega e envie.">
<meta name="theme-color" content="#FFFFFF">
<meta property="og:title" content="Faça seu pedido online">
<meta property="og:description" content="Escolha os produtos, a data de retirada ou entrega e envie o pedido.">
<link rel="icon" type="image/svg+xml" href="/app/icons/icon.svg">
<link rel="preload" href="/fonts/fraunces-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Fraunces: SIL Open Font License 1.1 */
@font-face{font-family:"Fraunces";font-weight:600;font-display:swap;src:url(/fonts/fraunces-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-weight:500;font-display:swap;src:url(/app/fonts/manrope-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-weight:700;font-display:swap;src:url(/app/fonts/manrope-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-weight:800;font-display:swap;src:url(/app/fonts/manrope-latin-800-normal.woff2) format("woff2")}
:root{--ink:#23263A;--ink2:#5B5F78;--bg:#FFFFFF;--surf:#F5F4F8;--line:#E4E3EA;--acc:#B5285A;--acc-d:#951E48;--acc-soft:#FBE9F0;--ok:#1F7A55;--ok-soft:#E3F4EC;--bad:#B3261E;
  --display:"Fraunces",Georgia,serif;--txt:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:500 16px/1.5 var(--txt);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;padding-bottom:96px}
button,input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:8px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
.muted{color:var(--ink2)}

/* Topo da loja */
.topo{padding:30px 0 10px}
.topo h1{font:600 clamp(32px,7vw,48px)/1.05 var(--display);letter-spacing:-.015em;margin:0}
.topo .bio{margin:10px 0 0;color:var(--ink2);max-width:62ch;font-size:17px}
.infos{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding:0;list-style:none}
.infos li{background:var(--surf);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:700}
.infos a{text-decoration:none}
.infos .wa{background:var(--ok-soft);color:var(--ok)}

/* Categorias */
.cats{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.cats .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
.cats .wrap::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-weight:700;font-size:14.5px;cursor:pointer}
.cats button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}

/* Produtos */
.secao{margin:26px 0 6px;font:600 24px/1.2 var(--display)}
.grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:12px}
@media (min-width:700px){.grade{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}}
@media (min-width:980px){.grade{grid-template-columns:repeat(4,minmax(0,1fr))}}
.prod{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;padding:0;cursor:pointer;position:relative}
.prod .foto{aspect-ratio:1;width:100%;object-fit:cover;background:var(--surf)}
.ph{aspect-ratio:1;width:100%;display:grid;place-items:center;font:600 34px/1 var(--display)}
.prod .tx{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.prod b{font-size:15.5px;line-height:1.3}
.prod .pr{font-weight:800;font-size:16px;margin-top:auto;padding-top:6px}
.prod .pr small{font-weight:600;color:var(--ink2);font-size:13px}
.tag{position:absolute;top:8px;left:8px;background:#fff;color:var(--ok);font-size:12px;font-weight:800;padding:4px 8px;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.qtd{position:absolute;top:8px;right:8px;background:var(--acc);color:#fff;font-size:13px;font-weight:800;min-width:26px;height:26px;border-radius:13px;display:grid;place-items:center;padding:0 7px}

/* Barra do pedido */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(255,255,255,.96) 30%)}
.barra button{width:100%;max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;border-radius:16px;background:var(--acc);color:#fff;padding:15px 18px;font-weight:800;font-size:16.5px;cursor:pointer;box-shadow:0 10px 24px -10px rgba(181,40,90,.7)}
.barra button:hover{background:var(--acc-d)}

/* Folhas (produto e pedido) */
.fundo{position:fixed;inset:0;background:rgba(20,22,35,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.folha{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));position:relative}
@media (min-width:700px){.fundo{align-items:center}.folha{border-radius:24px;max-height:88vh}}
.folha h2{font:600 26px/1.15 var(--display);margin:4px 40px 6px 0}
.fechar{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:22px;line-height:1;cursor:pointer}
.folha .grande{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px;margin-bottom:14px;background:var(--surf)}
.folha .ph{border-radius:18px;margin-bottom:14px}
.desc{color:var(--ink2);margin:6px 0 0;white-space:pre-line}
.alerg{font-size:14px;color:var(--ink2);margin-top:8px}
.passo{display:flex;align-items:center;gap:10px}
.passo button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:22px;font-weight:700;cursor:pointer}
.passo output{min-width:48px;text-align:center;font-weight:800;font-size:18px}
.add{margin-top:18px;display:flex;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:14px;border:0;background:var(--acc);color:#fff;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none;flex:1}
.btn:hover{background:var(--acc-d)}
.btn.linha{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.linha:hover{background:var(--surf)}
.btn.wa{background:#1F7A55}
.btn.wa:hover{background:#18643f}
.btn[disabled]{opacity:.6;cursor:default}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-size:15.5px}
.item .nm small{color:var(--ink2)}
.item .passo button{width:36px;height:36px;font-size:18px}
.item .passo output{min-width:34px;font-size:16px}
.tot{display:flex;justify-content:space-between;padding:6px 0;font-size:15.5px}
.tot.big{font-weight:800;font-size:19px;padding-top:10px}
.lbl{display:block;font-weight:800;font-size:13.5px;color:var(--ink2);margin:16px 0 6px}
.campo{display:block;margin-top:12px;font-weight:700;font-size:14.5px}
.campo input,.campo textarea{display:block;width:100%;margin-top:6px;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;font-weight:500;font-size:16px}
.campo input:focus,.campo textarea:focus{border-color:var(--acc);outline:none}
.campo.erro input,.campo.erro textarea{border-color:var(--bad)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--surf);padding:5px;border-radius:14px}
.seg button{border:0;background:none;border-radius:10px;padding:11px 6px;font-weight:800;font-size:15px;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.aviso{background:var(--acc-soft);color:var(--acc-d);border-radius:12px;padding:12px 14px;font-size:14.5px;font-weight:700;margin-top:14px}
.aviso.erro{background:#FDECEA;color:var(--bad)}
.nota{font-size:14px;color:var(--ink2);margin-top:12px}
.ok{text-align:center;padding:10px 0}
.ok .sel{width:72px;height:72px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:6px auto 10px}
.ok .sel svg{width:38px;height:38px}
.ok h2{margin:0 0 6px}
.resumo{text-align:left;background:var(--surf);border-radius:14px;padding:14px;margin:14px 0;white-space:pre-line;font-size:15px}
.estado{text-align:center;padding:90px 20px 40px;max-width:520px;margin:0 auto}
.estado h1{font:600 32px/1.15 var(--display);margin:0 0 10px}
.esq{background:linear-gradient(90deg,var(--surf),#ECEBF1,var(--surf));background-size:200% 100%;animation:esq 1.2s linear infinite;border-radius:18px}
@keyframes esq{to{background-position:-200% 0}}
.rodape{text-align:center;padding:36px 18px 20px;font-size:14px;color:var(--ink2)}
.rodape a{font-weight:800;text-underline-offset:4px}
@media (prefers-reduced-motion:reduce){.esq{animation:none}}
</style>
</head>
<body>
<main id="app" aria-live="polite"><div class="wrap"><div class="topo"><div class="esq" style="height:44px;width:60%"></div><div class="esq" style="height:18px;width:80%;margin-top:14px"></div></div>
<div class="grade"><div class="esq" style="aspect-ratio:.8"></div><div class="esq" style="aspect-ratio:.8"></div><div class="esq" style="aspect-ratio:.8"></div><div class="esq" style="aspect-ratio:.8"></div></div></div></main>
<div id="barra"></div>
<div id="folha"></div>
<footer class="rodape">Loja criada com o <a href="https://saus360.com.br/?utm_source=loja" target="_blank" rel="noopener">Saus360</a>, o sistema para confeitarias.</footer>
<script src="/app/config.js"></script>
<script>
(function () {
  "use strict";
  var CFG = window.DECANTA_CONFIG || {};
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var digits = function (s) { return String(s || "").replace(/\D/g, ""); };
  var m = location.pathname.match(/^\/loja\/([a-z0-9-]{3,40})\/?$/i);
  var slug = m ? m[1].toLowerCase() : (new URLSearchParams(location.search).get("l") || location.hash.replace(/^#\/?/, "") || "").toLowerCase();
  var L = null, PRODS = [], CAT = "todos", CARRO = {}, FORM = { nome: "", fone: "", modo: "", end: "", data: "", hora: "", obs: "" }, ENVIANDO = false, ERRO = "", CAMPO = "";
  var MOEDA = { BR: ["pt-BR", "BRL"], MX: ["es-MX", "MXN"], US: ["en-US", "USD"] };
  var money = function (n) { var c = MOEDA[(L && L.pais) || "BR"] || MOEDA.BR; return Number(n || 0).toLocaleString(c[0], { style: "currency", currency: c[1] }); };
  var numTxt = function (n) { return Number(n).toLocaleString("pt-BR", { maximumFractionDigits: 3 }); };
  var dataBR = function (s) { if (!s) return ""; var p = s.split("-"); return p[2] + "/" + p[1]; };
  var somaDias = function (iso, n) { var d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  var CORES = [["#FBE9F0", "#951E48"], ["#E7F1FB", "#1D5C96"], ["#FFF3DC", "#8A5A00"], ["#E8F6EF", "#1F7A55"], ["#EFEAFB", "#5B3FA6"]];
  var cor = function (s) { var h = 0; String(s).split("").forEach(function (c) { h = (h * 31 + c.charCodeAt(0)) >>> 0; }); return CORES[h % CORES.length]; };
  var iniciais = function (s) { var w = String(s || "?").split(/\s+/).filter(function (x) { return x && !/^(de|da|do|das|dos|com|e|no|na|em|\d.*)$/i.test(x); }); return (w.length ? w : [String(s || "?")]).slice(0, 2).map(function (x) { return x[0]; }).join("").toUpperCase(); };
  var ph = function (p) { var c = cor(p.nome); return '<div class="ph" style="background:' + c[0] + ";color:" + c[1] + '" aria-hidden="true">' + esc(iniciais(p.nome)) + "</div>"; };
  var passoDe = function (p) { return p.un === "un" ? 1 : 0.5; };
  var CHAVE = "saus360-loja-" + slug;
  function guardar() { try { localStorage.setItem(CHAVE, JSON.stringify({ c: CARRO, f: { nome: FORM.nome, fone: FORM.fone, end: FORM.end } })); } catch (e) {} }
  function recuperar() { try { var g = JSON.parse(localStorage.getItem(CHAVE) || "null"); if (g) { CARRO = g.c || {}; Object.assign(FORM, g.f || {}); } } catch (e) {} }

  function rpc(nome, corpo) {
    return fetch(CFG.supabaseUrl + "/rest/v1/rpc/" + nome, { method: "POST", headers: { apikey: CFG.supabaseAnonKey, Authorization: "Bearer " + CFG.supabaseAnonKey, "Content-Type": "application/json" }, body: JSON.stringify(corpo) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error((j && j.message) || "Erro " + r.status); return j; }); });
  }
  function estado(titulo, texto) {
    $("app").innerHTML = '<div class="estado"><h1>' + esc(titulo) + '</h1><p class="muted">' + texto + '</p><p style="margin-top:22px"><a class="btn linha" style="display:inline-flex;flex:none" href="https://saus360.com.br/">Conhecer o Saus360</a></p></div>';
  }

  function carregar() {
    if (!slug) { estado("Página não encontrada", "Confira o endereço que você recebeu."); return; }
    if (!CFG.supabaseUrl) { estado("Loja indisponível", "Tente de novo em instantes."); return; }
    rpc("loja_publica", { p_slug: slug }).then(function (r) {
      if (!r || !r.ok) {
        if (r && r.motivo === "fechada") estado(r.nome || "Loja fechada", "A loja online está pausada no momento. Fale com a loja para fazer seu pedido.");
        else if (r && r.motivo === "indisponivel") estado(r.nome || "Loja indisponível", "Esta loja não está recebendo pedidos agora.");
        else estado("Loja não encontrada", "Confira o endereço que você recebeu.");
        return;
      }
      L = r.loja; L.hoje = r.hoje; PRODS = r.produtos || [];
      document.title = L.nome + " · Faça seu pedido";
      recuperar();
      Object.keys(CARRO).forEach(function (id) { if (!PRODS.some(function (p) { return p.id === id; })) delete CARRO[id]; });
      if (!FORM.modo) FORM.modo = L.retirada ? "retirada" : "entrega";
      if (!FORM.data) FORM.data = somaDias(L.hoje, L.antecedencia);
      desenhar();
    }).catch(function () { estado("Sem conexão", "Não foi possível abrir a loja. Verifique a internet e tente de novo."); });
  }

  function catsUsadas() {
    var nomes = {}; (L.cats || []).forEach(function (c) { nomes[c.id] = c.l; });
    var ids = []; PRODS.forEach(function (p) { if (ids.indexOf(p.cat) < 0) ids.push(p.cat); });
    return ids.map(function (id) { return { id: id, l: nomes[id] || "Outros" }; });
  }
  function card(p) {
    var q = CARRO[p.id] || 0;
    return '<button class="prod" data-a="ver" data-id="' + esc(p.id) + '" aria-label="' + esc(p.nome) + ", " + money(p.preco) + '">' +
      (p.foto ? '<img class="foto" src="' + esc(p.foto) + '" alt="" loading="lazy">' : ph(p)) +
      (p.pronta ? '<span class="tag">Pronta entrega</span>' : "") + (q ? '<span class="qtd">' + numTxt(q) + "</span>" : "") +
      '<span class="tx"><b>' + esc(p.nome) + '</b><span class="pr">' + money(p.preco) + (p.un !== "un" ? " <small>/" + esc(p.un) + "</small>" : "") + "</span></span></button>";
  }
  function desenhar() {
    var cs = catsUsadas(), infos = [];
    if (L.retirada) infos.push("<li>Retirada" + (L.endereco ? " · " + esc(L.endereco) : "") + "</li>");
    if (L.entrega) infos.push("<li>Entrega" + (Number(L.taxa) > 0 ? " · taxa " + money(L.taxa) : " grátis") + "</li>");
    infos.push("<li>" + (L.antecedencia > 0 ? "Pedidos com " + L.antecedencia + (L.antecedencia === 1 ? " dia" : " dias") + " de antecedência" : "Pedidos para hoje") + "</li>");
    if (L.horario) infos.push("<li>" + esc(L.horario) + "</li>");
    if (Number(L.minimo) > 0) infos.push("<li>Pedido mínimo " + money(L.minimo) + "</li>");
    if (L.whatsapp) infos.push('<li class="wa"><a href="' + waLink("Olá! Vim pela loja online.") + '" target="_blank" rel="noopener">WhatsApp</a></li>');
    var h = '<div class="wrap"><header class="topo"><h1>' + esc(L.nome) + "</h1>" + (L.bio ? '<p class="bio">' + esc(L.bio) + "</p>" : "") + '<ul class="infos">' + infos.join("") + "</ul></header></div>";
    if (cs.length > 1) h += '<nav class="cats" aria-label="Categorias"><div class="wrap"><button data-a="cat" data-id="todos" aria-pressed="' + (CAT === "todos") + '">Tudo</button>' +
      cs.map(function (c) { return '<button data-a="cat" data-id="' + esc(c.id) + '" aria-pressed="' + (CAT === c.id) + '">' + esc(c.l) + "</button>"; }).join("") + "</div></nav>";
    h += '<div class="wrap">';
    if (!PRODS.length) h += '<div class="estado" style="padding-top:40px"><h1 style="font-size:24px">Cardápio em preparação</h1><p class="muted">A loja ainda está colocando os produtos. Volte em breve ou fale pelo WhatsApp.</p></div>';
    cs.filter(function (c) { return CAT === "todos" || CAT === c.id; }).forEach(function (c) {
      var ps = PRODS.filter(function (p) { return p.cat === c.id; });
      if (cs.length > 1) h += '<h2 class="secao">' + esc(c.l) + "</h2>";
      h += '<div class="grade">' + ps.map(card).join("") + "</div>";
    });
    h += "</div>";
    $("app").innerHTML = h;
    barra();
  }
  function carro() {
    var itens = [], total = 0, n = 0;
    Object.keys(CARRO).forEach(function (id) { var p = PRODS.find(function (x) { return x.id === id; }), q = CARRO[id]; if (p && q > 0) { itens.push({ p: p, q: q }); total += Math.round(q * p.preco * 100) / 100; n += p.un === "un" ? q : 1; } });
    return { itens: itens, total: Math.round(total * 100) / 100, n: n };
  }
  function barra() {
    var c = carro();
    $("barra").innerHTML = c.itens.length ? '<div class="barra"><button data-a="pedido"><span>Ver pedido · ' + numTxt(c.n) + (c.n === 1 ? " item" : " itens") + "</span><span>" + money(c.total) + "</span></button></div>" : "";
  }
  function abrir(html, rotulo) {
    $("folha").innerHTML = '<div class="fundo" data-a="fechar-fundo"><div class="folha" role="dialog" aria-modal="true" aria-label="' + esc(rotulo) + '"><button class="fechar" data-a="fechar" aria-label="Fechar">×</button>' + html + "</div></div>";
    document.body.style.overflow = "hidden";
    var f = document.querySelector(".folha .fechar"); if (f) f.focus({ preventScroll: true });
  }
  function fechar() { $("folha").innerHTML = ""; document.body.style.overflow = ""; }

  function verProduto(id, q) {
    var p = PRODS.find(function (x) { return x.id === id; }); if (!p) return;
    if (q == null) q = CARRO[id] || passoDe(p);
    abrir((p.foto ? '<img class="grande" src="' + esc(p.foto) + '" alt="' + esc(p.nome) + '">' : ph(p)) +
      "<h2>" + esc(p.nome) + '</h2><div class="pr" style="font-weight:800;font-size:19px">' + money(p.preco) + (p.un !== "un" ? " / " + esc(p.un) : "") + "</div>" +
      (p.pronta ? '<div class="nota" style="color:var(--ok);font-weight:800">Pronta entrega</div>' : "") +
      (p.desc ? '<p class="desc">' + esc(p.desc) + "</p>" : "") + (p.alerg ? '<p class="alerg">Contém: ' + esc(p.alerg) + "</p>" : "") +
      '<div class="add"><div class="passo"><button data-a="menos" data-id="' + esc(id) + '" aria-label="Diminuir">−</button><output id="q">' + numTxt(q) + '</output><button data-a="mais" data-id="' + esc(id) + '" aria-label="Aumentar">+</button></div>' +
      '<button class="btn" data-a="por" data-id="' + esc(id) + '">' + (CARRO[id] ? "Atualizar" : "Adicionar") + " · " + money(q * p.preco) + "</button></div>" +
      (CARRO[id] ? '<button class="btn linha" style="width:100%;margin-top:10px" data-a="tirar" data-id="' + esc(id) + '">Tirar do pedido</button>' : ""), p.nome);
    $("folha").dataset.q = q;
  }

  function verPedido() {
    var c = carro(); if (!c.itens.length) { fechar(); return; }
    var taxa = FORM.modo === "entrega" ? Number(L.taxa || 0) : 0, min = somaDias(L.hoje, L.antecedencia), falta = Number(L.minimo) > 0 && c.total < Number(L.minimo);
    var cl = function (k) { return "campo" + (CAMPO === k ? " erro" : ""); };
    var h = "<h2>Seu pedido</h2>" + c.itens.map(function (it) {
      return '<div class="item"><div class="nm"><b>' + esc(it.p.nome) + "</b><small>" + money(it.p.preco) + (it.p.un !== "un" ? " / " + esc(it.p.un) : "") + '</small></div><div class="passo"><button data-a="c-menos" data-id="' + esc(it.p.id) + '" aria-label="Diminuir">−</button><output>' + numTxt(it.q) + '</output><button data-a="c-mais" data-id="' + esc(it.p.id) + '" aria-label="Aumentar">+</button></div></div>';
    }).join("");
    h += '<div class="tot" style="margin-top:8px"><span>Produtos</span><span>' + money(c.total) + "</span></div>" + (taxa ? '<div class="tot"><span>Taxa de entrega</span><span>' + money(taxa) + "</span></div>" : "") + '<div class="tot big"><span>Total</span><span>' + money(c.total + taxa) + "</span></div>";
    if (falta) h += '<div class="aviso">O pedido mínimo é ' + money(L.minimo) + ". Faltam " + money(Number(L.minimo) - c.total) + ".</div>";
    if (L.retirada && L.entrega) h += '<span class="lbl">Como você quer receber</span><div class="seg"><button data-a="modo" data-id="retirada" aria-pressed="' + (FORM.modo === "retirada") + '">Retirar na loja</button><button data-a="modo" data-id="entrega" aria-pressed="' + (FORM.modo === "entrega") + '">Entrega' + (Number(L.taxa) > 0 ? " · " + money(L.taxa) : "") + "</button></div>";
    else h += '<span class="lbl">' + (FORM.modo === "entrega" ? "Entrega no seu endereço" : "Retirada na loja" + (L.endereco ? ": " + esc(L.endereco) : "")) + "</span>";
    if (FORM.modo === "retirada" && L.endereco && L.entrega) h += '<p class="nota" style="margin-top:6px">Retirada em ' + esc(L.endereco) + "</p>";
    h += '<div class="dupla"><label class="' + cl("data") + '">Dia<input type="date" data-f="data" min="' + min + '" max="' + somaDias(L.hoje, 120) + '" value="' + esc(FORM.data) + '"></label><label class="campo">Horário (opcional)<input type="time" data-f="hora" value="' + esc(FORM.hora) + '"></label></div>';
    if (L.horario) h += '<p class="nota" style="margin-top:6px">Atendimento: ' + esc(L.horario) + "</p>";
    if (FORM.modo === "entrega") h += '<label class="' + cl("end") + '">Endereço de entrega<input data-f="end" autocomplete="street-address" value="' + esc(FORM.end) + '" placeholder="Rua, número, bairro"></label>';
    h += '<label class="' + cl("nome") + '">Seu nome<input data-f="nome" autocomplete="name" value="' + esc(FORM.nome) + '"></label>' +
      '<label class="' + cl("fone") + '">Seu WhatsApp<input data-f="fone" type="tel" inputmode="tel" autocomplete="tel" value="' + esc(FORM.fone) + '" placeholder="(47) 99999-0000"></label>' +
      '<label class="campo">Observação (opcional)<textarea data-f="obs" rows="2" maxlength="500" placeholder="Ex.: sem granulado, mensagem no bolo">' + esc(FORM.obs) + "</textarea></label>";
    if (ERRO) h += '<div class="aviso erro" role="alert">' + esc(ERRO) + "</div>";
    h += '<button class="btn" style="width:100%;margin-top:16px" data-a="enviar" ' + (ENVIANDO || falta ? "disabled" : "") + ">" + (ENVIANDO ? "Enviando…" : "Enviar pedido · " + money(c.total + taxa)) + "</button>" +
      '<p class="nota">A loja confirma o pedido e combina o pagamento com você pelo WhatsApp.</p>';
    abrir(h, "Seu pedido");
  }
  function waLink(txt) { var d = digits(L.whatsapp); if (d && d.length <= 11 && (L.pais || "BR") === "BR") d = "55" + d; return "https://wa.me/" + d + "?text=" + encodeURIComponent(txt); }

  function enviar() {
    var c = carro(); if (!c.itens.length || ENVIANDO) return;
    ERRO = ""; CAMPO = "";
    if (FORM.modo === "entrega" && FORM.end.trim().length < 8) { ERRO = "Informe o endereço de entrega."; CAMPO = "end"; }
    else if (FORM.nome.trim().length < 2) { ERRO = "Informe seu nome."; CAMPO = "nome"; }
    else if (digits(FORM.fone).length < 10) { ERRO = "Informe seu WhatsApp com DDD."; CAMPO = "fone"; }
    else if (!FORM.data || FORM.data < somaDias(L.hoje, L.antecedencia)) { ERRO = "Escolha o dia a partir de " + dataBR(somaDias(L.hoje, L.antecedencia)) + "."; CAMPO = "data"; }
    if (ERRO) { verPedido(); return; }
    ENVIANDO = true; verPedido();
    rpc("loja_pedido", { p_slug: slug, p: { nome: FORM.nome.trim(), fone: FORM.fone, modo: FORM.modo, end: FORM.end.trim(), data: FORM.data, hora: FORM.hora, obs: FORM.obs.trim(),
      itens: c.itens.map(function (it) { return { id: it.p.id, q: it.q }; }) } })
      .then(function (r) {
        ENVIANDO = false;
        if (!r || !r.ok) { ERRO = (r && r.erro) || "Não foi possível enviar. Tente de novo."; CAMPO = (r && r.campo) || ""; verPedido(); return; }
        var quando = (r.modo === "entrega" ? "Entrega" : "Retirada") + " em " + dataBR(r.data) + (r.hora ? " às " + r.hora : "");
        var msg = "Olá! Acabei de fazer o pedido #" + r.num + " pela loja online:\n" + r.resumo + "\nTotal: " + money(r.total) + "\n" + quando + (r.modo === "entrega" ? "\nEndereço: " + FORM.end.trim() : "") + (FORM.obs.trim() ? "\nObs.: " + FORM.obs.trim() : "") + "\nNome: " + FORM.nome.trim();
        CARRO = {}; FORM.obs = ""; FORM.hora = ""; guardar(); barra(); desenhar();
        abrir('<div class="ok"><div class="sel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg></div>' +
          "<h2>Pedido #" + r.num + ' enviado!</h2><p class="muted">' + esc(L.nome) + " vai confirmar o pedido e combinar o pagamento com você.</p>" +
          '<div class="resumo">' + esc(r.resumo) + "\n\nTotal: " + money(r.total) + "\n" + esc(quando) + "</div>" +
          (r.whatsapp ? '<a class="btn wa" style="width:100%" href="' + waLink(msg) + '" target="_blank" rel="noopener">Avisar a loja pelo WhatsApp</a>' : "") +
          '<button class="btn linha" style="width:100%;margin-top:10px" data-a="fechar">Voltar para a loja</button></div>', "Pedido enviado");
      })
      .catch(function () { ENVIANDO = false; ERRO = "Sem conexão. Verifique a internet e tente de novo."; verPedido(); });
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-a]"); if (!t) return;
    var a = t.dataset.a, id = t.dataset.id, p = id && PRODS.find(function (x) { return x.id === id; });
    if (a === "fechar-fundo" && e.target !== t) return;
    if (a === "fechar" || a === "fechar-fundo") { fechar(); return; }
    if (a === "cat") { CAT = id; desenhar(); window.scrollTo({ top: document.querySelector(".cats").offsetTop, behavior: "smooth" }); return; }
    if (a === "ver") { verProduto(id); return; }
    if ((a === "mais" || a === "menos") && p) { var q = Number($("folha").dataset.q || passoDe(p)); q = a === "mais" ? q + passoDe(p) : Math.max(passoDe(p), q - passoDe(p)); verProduto(id, Math.min(999, q)); return; }
    if (a === "por" && p) { CARRO[id] = Number($("folha").dataset.q || passoDe(p)); guardar(); fechar(); desenhar(); return; }
    if (a === "tirar") { delete CARRO[id]; guardar(); fechar(); desenhar(); return; }
    if (a === "pedido") { ERRO = ""; CAMPO = ""; verPedido(); return; }
    if ((a === "c-mais" || a === "c-menos") && p) { var n = (CARRO[id] || 0) + (a === "c-mais" ? passoDe(p) : -passoDe(p)); if (n <= 0) delete CARRO[id]; else CARRO[id] = Math.min(999, n); guardar(); barra(); desenhar(); verPedido(); return; }
    if (a === "modo") { FORM.modo = id; ERRO = ""; verPedido(); return; }
    if (a === "enviar") { enviar(); return; }
  });
  document.addEventListener("input", function (e) { var f = e.target.dataset && e.target.dataset.f; if (f) { FORM[f] = e.target.value; if (f !== "obs") guardar(); if (f === CAMPO) { CAMPO = ""; var c = e.target.closest(".campo"); if (c) c.classList.remove("erro"); } } });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && $("folha").innerHTML) fechar(); });
  carregar();
})();
</script>
</body>
</html>
