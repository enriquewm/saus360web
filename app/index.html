<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2F2ED">
<title>Saus360</title>
<style>@font-face{font-family:"Manrope";font-style:normal;font-display:swap;font-weight:400;src:url(fonts/manrope-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-style:normal;font-display:swap;font-weight:500;src:url(fonts/manrope-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-style:normal;font-display:swap;font-weight:600;src:url(fonts/manrope-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-style:normal;font-display:swap;font-weight:700;src:url(fonts/manrope-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-style:normal;font-display:swap;font-weight:800;src:url(fonts/manrope-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Fraunces";font-style:normal;font-display:swap;font-weight:600;src:url(fonts/fraunces-latin-600-normal.woff2) format("woff2")}
</style>
<style>
/* Hallmark · shape: app screen · genre: playful · theme: brand · redesign: restyle
 * paper: oklch(97.6% 0.022 82) · accent: oklch(80.6% 0.146 76) · display: Fraunces · body: Manrope
 * nav: kept (bottom bar on phones, side bar on desktop), restyled as a floating pill · signature: the month's sales card, tinta with a doce-de-leite disc · states: loading, empty, error, full (the ones the screens already have)
 * axes: cream/serif-head/doce · posture: kept · contrast: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H4 E4 S4 R4 V4 · weakest: S, a restyle keeps every screen's layout, so the brand carries through paper, the pressed doce button and the Fraunces heads rather than new compositions */
/* Hallmark · waive 24b · spacing kept from the existing app layout · a restyle keeps every screen's spacing; the confeitaria owners already know these screens */
/* Hallmark · waive 28b · the barcode scanner video is a live camera feed · a camera preview has no poster frame to show */
/* Hallmark · dismissed 41 · .card and .panel inherit --ink from body, which flips to the light ink in dark mode */
/* Hallmark · dismissed F5 · .iconbtn is a round button surface (theme, back), not a decorative coin around an icon */
/* Hallmark · answered F7 · round is the brand's shape (the landing's pills and discs): avatars, counts and status dots stay round on purpose */
/* Hallmark · answered F23 · the app sits behind a sign-in and is noindex; the landing carries the description */
/* Saus360 · sistema visual da app, o mesmo da landing: papel creme, tinta azul-marinho, amarelo doce de leite só na ação principal,
   menta/hortelã para o que está selecionado, Fraunces nos títulos e Manrope em todo o resto. */
:root{
  --frame:#F5EADA; --bg:#FFF7EA; --surface:#FFFDF8; --surface-2:#FBF0DE; --ink:#1F2340; --muted:#5B6080; --line:#EFE2CC;
  --accent:#0B6B8A; --accent-ink:#FFFDF8; --accent-soft:#DDF3EE; --hero:#1F2340; --hero-ink:#FFFDF8; --brand2:#0E7C9F; --mint:#7CD5C7;
  --primary:#F6B93B; --primary-hi:#FFC64F; --primary-edge:#E0A21F; --primary-ink:#1F2340;
  --good:#2C7A4B; --good-bg:#E2F3E8; --warn:#8A5A00; --warn-bg:#FFEFC7; --bad:#B42318; --bad-bg:#FCE3E8; --info:#235A80; --info-bg:#E0F0F7;
  --white:#FFFDF8; --black:#0B0C16; --on-dark:#FFFDF8; --on-dark-2:color-mix(in srgb,#FFFDF8 74%,transparent); --on-dark-3:color-mix(in srgb,#FFFDF8 52%,transparent);
  --veu-1:color-mix(in srgb,#FFFDF8 9%,transparent); --veu-2:color-mix(in srgb,#FFFDF8 14%,transparent); --veu-3:color-mix(in srgb,#FFFDF8 24%,transparent);
  --hair:color-mix(in srgb,#1F2340 14%,transparent); --scrim:color-mix(in srgb,#1F2340 48%,transparent);
  --inv-pend:#4A4E68; --inv-pend-ink:#F6F2EA; --inv-pend-ph:#9A9DB0; --pix-bg:#FFFDF8; --lim:#FFB4A8;
  --side-bg:#1F2340; --side-ink:color-mix(in srgb,#FFFDF8 72%,transparent); --side-hi:color-mix(in srgb,#FFFDF8 9%,transparent); --side-on:color-mix(in srgb,#7CD5C7 18%,transparent);
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --display:"Fraunces",Georgia,"Times New Roman",serif; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:22px; --r-s:14px; --r-p:999px;
  --shadow:0 1px 0 color-mix(in srgb,#1F2340 6%,transparent),0 10px 24px -16px color-mix(in srgb,#1F2340 34%,transparent);
  --shadow-g:0 1px 0 color-mix(in srgb,#1F2340 8%,transparent),0 26px 50px -24px color-mix(in srgb,#1F2340 48%,transparent);
  --dur-micro:120ms; --dur-short:220ms; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --frame:#0C0E1D; --bg:#14172B; --surface:#1D2139; --surface-2:#262A47; --ink:#F5EFE4; --muted:#A8ACC6; --line:#2E3354;
    --accent:#7CD5C7; --accent-ink:#10203A; --accent-soft:#1C3A44; --hero:#262A4D; --hero-ink:#F5EFE4; --brand2:#7CD5C7;
    --good:#72D09A; --good-bg:#16301F; --warn:#F2BE5C; --warn-bg:#3A2C10; --bad:#FF8C7D; --bad-bg:#3E1B22; --info:#8DC3E6; --info-bg:#172A3A;
    --inv-pend:#353A5A; --side-bg:#0C0E1D; --hair:color-mix(in srgb,#F5EFE4 14%,transparent); --scrim:color-mix(in srgb,#05060E 62%,transparent);
    --shadow:0 1px 0 color-mix(in srgb,#F5EFE4 5%,transparent); --shadow-g:0 26px 60px -20px color-mix(in srgb,#05060E 80%,transparent); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --frame:#0C0E1D; --bg:#14172B; --surface:#1D2139; --surface-2:#262A47; --ink:#F5EFE4; --muted:#A8ACC6; --line:#2E3354;
  --accent:#7CD5C7; --accent-ink:#10203A; --accent-soft:#1C3A44; --hero:#262A4D; --hero-ink:#F5EFE4; --brand2:#7CD5C7;
  --good:#72D09A; --good-bg:#16301F; --warn:#F2BE5C; --warn-bg:#3A2C10; --bad:#FF8C7D; --bad-bg:#3E1B22; --info:#8DC3E6; --info-bg:#172A3A;
  --inv-pend:#353A5A; --side-bg:#0C0E1D; --hair:color-mix(in srgb,#F5EFE4 14%,transparent); --scrim:color-mix(in srgb,#05060E 62%,transparent);
  --shadow:0 1px 0 color-mix(in srgb,#F5EFE4 5%,transparent); --shadow-g:0 26px 60px -20px color-mix(in srgb,#05060E 80%,transparent); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow-x:clip}
body{background:var(--frame);color:var(--ink);font:500 15px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--brand2);outline-offset:2px;border-radius:8px}
::selection{background:color-mix(in srgb,var(--primary) 40%,transparent);color:var(--ink)}
.app{max-width:460px;margin:0 auto;min-height:100%;background:var(--bg);padding:calc(18px + env(safe-area-inset-top)) 16px 124px}
.app.with-foot{padding-bottom:224px}
.app.bare{padding-bottom:40px}
@media (min-width:500px){.app{box-shadow:0 0 0 1px var(--line),var(--shadow-g)}}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.top > div{min-width:0;flex:1}
.top > div:not(.hdr-actions){display:flex;flex-direction:column;min-width:min-content}
.top h1{overflow-wrap:normal}
h1{font:600 30px/1.08 var(--display);margin:0;letter-spacing:-.015em;text-wrap:balance;overflow-wrap:break-word;min-width:0;font-synthesis:none}
h1.sm{font-size:25px}
/* o contexto (empresa, área) vem embaixo do título, não em cima: o título lidera */
.eyebrow{order:2;margin:5px 0 0;font-size:13.5px;color:var(--muted)}
.iconbtn{width:44px;height:44px;border-radius:var(--r-p);border:0;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink);box-shadow:var(--shadow);transition:transform var(--dur-micro),background-color var(--dur-micro)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn:active{transform:scale(.94)}
.me{display:flex;align-items:center;gap:8px;background:var(--surface);border:0;border-radius:var(--r-p);padding:5px 14px 5px 5px;font-size:13px;font-weight:700;flex:none;box-shadow:var(--shadow)}

/* Assinatura: o cartão do mês em tinta, com o disco doce de leite da landing no canto */
.hero{display:block;width:100%;text-align:left;border:0;border-radius:28px;padding:20px 20px 18px;background:radial-gradient(circle at calc(100% + 34px) -34px,var(--primary) 0 92px,transparent 93px),var(--hero);color:var(--hero-ink);position:relative;overflow:hidden;box-shadow:var(--shadow-g)}

.hero .hl{display:block;font-size:13.5px;font-weight:600;color:var(--on-dark-2)}
.hero .big{display:block;font:800 36px/1.1 var(--body);letter-spacing:-.025em;margin:6px 0 6px;font-variant-numeric:tabular-nums}
.hero .sub{font-size:14px;color:var(--on-dark-2)}
.hero .spark{display:flex;align-items:flex-end;gap:4px;height:34px;margin-top:12px}
.hero .spark i{flex:1;background:var(--veu-3);border-radius:4px 4px 1px 1px;min-height:2px}
.hero .spark i.now{background:var(--mint)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{background:var(--surface);border-radius:var(--r);padding:14px 15px;border:1.5px solid transparent;text-align:left;width:100%;box-shadow:var(--shadow);color:var(--ink);transition:border-color var(--dur-micro),transform var(--dur-micro)}
button.stat:active{transform:scale(.98)}
button.stat{cursor:pointer}
.stat span{font-size:13px;font-weight:600;color:var(--muted);display:block}
.stat b{display:block;font-size:21px;font-weight:800;letter-spacing:-.01em;margin-top:2px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat small{font-size:12px;color:var(--muted)}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)} .stat.good b{color:var(--good)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.quick.three{grid-template-columns:repeat(3,1fr)}
.quick.five{grid-template-columns:repeat(5,1fr);gap:6px} .quick.five button{font-size:11.5px;padding:11px 2px}
.quick.two{grid-template-columns:1fr 1fr}
.quick button,.quick a{background:var(--surface);border:1.5px solid transparent;border-radius:20px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:700;text-decoration:none;text-align:center;color:var(--ink);box-shadow:var(--shadow);transition:border-color var(--dur-micro),transform var(--dur-micro)}
.quick button:active,.quick a:active{transform:scale(.96)}
.quick svg{color:var(--accent);background:var(--accent-soft);border-radius:var(--r-p);padding:6px;width:36px;height:36px;box-sizing:border-box}
.quick button:disabled{opacity:.45;cursor:not-allowed}

.sec{font-size:15px;font-weight:800;letter-spacing:-.005em;color:var(--ink);margin:26px 2px 10px;display:flex;align-items:center;gap:8px}
.sec .lnk{margin-left:auto;font-size:13.5px;color:var(--accent);background:none;border:0;padding:4px 0;font-weight:700;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.count{background:var(--accent-soft);color:var(--accent);border-radius:var(--r-p);padding:1px 9px;font-size:12px;font-weight:800}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid transparent;border-radius:20px;padding:12px 13px;color:var(--ink);text-decoration:none;box-shadow:var(--shadow);transition:border-color var(--dur-micro)}
button.row:active,a.row:active{background:var(--surface-2)}
.row > svg{color:var(--muted);flex:none}
.row.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}
.row.off{opacity:.55}
.wmain{flex:1;min-width:0;display:block}
.wmain b{display:block;font-weight:700;font-size:15px;line-height:1.3}
.wmain small{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.right{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.right b{font-weight:700;font-variant-numeric:tabular-nums}
.right small{font-size:12px;color:var(--muted)}
.bt{width:42px;height:54px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.bt svg{height:42px;width:auto}
.bt.lg{width:68px;height:92px;border-radius:18px}
.bt.lg svg{height:74px}
.dot{width:40px;height:40px;border-radius:var(--r-p);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.dot.good{background:var(--good-bg);color:var(--good)} .dot.warn{background:var(--warn-bg);color:var(--warn)}
.dot.bad{background:var(--bad-bg);color:var(--bad)} .dot.acc{background:var(--accent-soft);color:var(--accent)} .dot.info{background:var(--info-bg);color:var(--info)}
.avatar{width:42px;height:42px;border-radius:var(--r-p);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.avatar.sm{width:30px;height:30px;border-radius:var(--r-p);font-size:12px}
.pill{display:inline-block;padding:3px 10px;border-radius:var(--r-p);font-size:12px;font-weight:800;white-space:nowrap}
.pill.ok{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent)} .pill.mute{background:var(--surface-2);color:var(--muted)}
.neg{color:var(--bad)} .pos{color:var(--good)}
small.good{color:var(--good)} small.warn{color:var(--warn)} small.bad{color:var(--bad);font-weight:600}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-p);padding:0 8px 0 16px;color:var(--muted);transition:border-color var(--dur-micro),box-shadow var(--dur-micro)}
.search:focus-within{border-color:var(--brand2);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand2) 18%,transparent)}
.search input{flex:1;border:0;background:transparent;padding:12px 0;font:inherit;font-size:16px;color:var(--ink);outline:none;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chips.tight{padding-top:0}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-p);padding:7px 15px;font-size:13.5px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:border-color var(--dur-micro),background-color var(--dur-micro)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:active{transform:scale(.97)}
.chip i{width:9px;height:9px;border-radius:50%;display:block}
.summary{font-size:13px;color:var(--muted);margin:10px 2px}

/* Ação principal: o amarelo doce de leite "apertável" da landing. Só ela usa o amarelo. */
.btn{background:var(--primary);color:var(--primary-ink);border:0;border-radius:var(--r-p);padding:12px 20px;font-weight:800;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 3px 0 var(--primary-edge);transition:transform var(--dur-micro),background-color var(--dur-micro),box-shadow var(--dur-micro)}
.btn:hover{background:var(--primary-hi)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--primary-edge)}
.btn.sm{padding:8px 14px;font-size:13px;box-shadow:0 2px 0 var(--primary-edge)}
.btn.ghost{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.btn.ghost:hover{background:color-mix(in srgb,var(--accent-soft) 70%,var(--accent))}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--hair);box-shadow:none}
.btn.line:hover{background:var(--surface-2)}
.btn.danger{background:var(--bad-bg);color:var(--bad);box-shadow:none}
.btn.danger:hover{background:color-mix(in srgb,var(--bad-bg) 80%,var(--bad))}
.btn.ghost:active,.btn.line:active,.btn.danger:active{transform:scale(.97)}
.btn.block{width:100%;padding:16px;margin-top:16px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btns .btn{width:100%}
.mini{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

.stepper{display:flex;align-items:center;background:var(--surface-2);border-radius:var(--r-p);flex:none}
.stepper button{width:40px;height:40px;border:0;background:transparent;font-size:21px;line-height:1;color:var(--ink);border-radius:var(--r-p);font-weight:700}
.stepper button:hover:not(:disabled){background:var(--surface)}
.stepper button:disabled{color:var(--muted);opacity:.35;cursor:not-allowed}
.stepper output{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.stepper.lg{justify-content:space-between;padding:6px;margin:14px 0 6px;border-radius:var(--r-p)}
.stepper.lg button{width:58px;height:58px;font-size:28px;background:var(--surface);border-radius:var(--r-p);box-shadow:var(--shadow)}
.stepper.lg input{flex:1;width:60px;text-align:center;border:0;background:transparent;font:800 40px/1 var(--body);color:var(--ink);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.card{background:var(--surface);border:0;border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.lbl{display:block;font-size:14px;font-weight:800;color:var(--ink);margin-bottom:8px}
.picker{width:100%;display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1.5px solid transparent;border-radius:16px;padding:12px;text-align:left;color:var(--ink)}
.picker:hover{border-color:var(--line)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:var(--r-p);padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:var(--r-p);padding:9px 4px;font-weight:700;font-size:14px;color:var(--muted);transition:background-color var(--dur-micro),color var(--dur-micro)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.note{border-radius:16px;padding:11px 14px;font-size:14px;margin-top:10px}
.note.good{background:var(--good-bg);color:var(--good)} .note.warn{background:var(--warn-bg);color:var(--warn)} .note.bad{background:var(--bad-bg);color:var(--bad)} .note.info{background:var(--info-bg);color:var(--info)}
.hint{font-size:13.5px;color:var(--muted);margin:8px 2px 0}
.center{text-align:center}

.ofoot{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:436px;background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:10px 10px 10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:var(--shadow-g);z-index:5}
.ofoot small{display:block;font-size:12px;color:var(--on-dark-2)}
.ofoot b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}

/* Abas: a pílula flutuante do menu da landing */
.tabbar{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:440px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border:0;border-radius:28px;padding:8px 4px 8px;box-shadow:var(--shadow-g),0 0 0 1px var(--line);z-index:6}
.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);padding:2px 0;transition:color var(--dur-micro)}
.tabbar button > svg{padding:3px 14px;border-radius:var(--r-p);box-sizing:content-box;transition:background-color var(--dur-micro)}
.tabbar button:hover{color:var(--ink)}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"] > svg{background:var(--accent-soft);color:var(--accent)}
.tabbar .fab{width:56px;height:56px;border-radius:var(--r-p);background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;margin-top:-30px;box-shadow:0 4px 0 var(--primary-edge),0 0 0 5px var(--surface);transition:transform var(--dur-micro)}
.tabbar button:active .fab{transform:translateY(3px)}
.tabbar[hidden]{display:none}

#scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s;z-index:10}
#scrim.open{opacity:1;visibility:visible;transition:opacity .2s}
#sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:460px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:30px 30px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,100%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s;z-index:11;outline:none}
#sheet.open{transform:translate(-50%,0);visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){#sheet,#scrim,.toast{transition:none!important}}
.handle{width:44px;height:5px;border-radius:var(--r-p);background:var(--hair);margin:4px auto 12px}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.shead h3{margin:0;font:600 22px/1.15 var(--display);letter-spacing:-.01em;flex:1;font-synthesis:none}
.shead .iconbtn{width:40px;height:40px}
.whead{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.whead > div{display:flex;flex-direction:column;min-width:0}
.whead h3{font:600 24px/1.12 var(--display);letter-spacing:-.015em;margin:0;text-wrap:balance;font-synthesis:none}
.stockbox{display:grid;grid-template-columns:1.3fr 1fr 1fr;background:var(--surface);border:0;border-radius:var(--r);box-shadow:var(--shadow)}
.stockbox > div{padding:12px;border-right:1px solid var(--line)}
.stockbox > div:last-child{border-right:0}
.stockbox span{font-size:12px;color:var(--muted)}
.stockbox b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stockbox small{font-size:12px;color:var(--muted)}
.stockbox.warn > div:first-child b{color:var(--warn)} .stockbox.bad > div:first-child b{color:var(--bad)}
.actions3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
.actions3 button{border:0;border-radius:var(--r-p);padding:13px 4px;font-weight:800;font-size:14px;background:var(--accent-soft);color:var(--accent);transition:transform var(--dur-micro)}
.actions3 button:active{transform:translateY(2px)}
.actions3 button:first-child{background:var(--primary);color:var(--primary-ink);box-shadow:0 3px 0 var(--primary-edge)}
.actions3 button:first-child:hover{background:var(--primary-hi)}
.actions3 button:disabled{opacity:.4;cursor:not-allowed}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;margin:12px 0 0;border:0;box-shadow:var(--shadow)}
.specs div{background:var(--surface);padding:10px 12px;min-width:0}
.specs div.full{grid-column:1/-1}
.specs dt{font-size:12px;color:var(--muted)}
.specs dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.field{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--ink);font-weight:700;margin-top:12px;min-width:0}
.field input,.field select,.field textarea{font:inherit;font-size:16px;font-weight:500;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-s);padding:12px 14px;width:100%;min-width:0;transition:border-color var(--dur-micro),box-shadow var(--dur-micro)}
.field input:hover,.field select:hover,.field textarea:hover{border-color:var(--hair)}
.field input:disabled,.field select:disabled,.field textarea:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed}
.field input[aria-invalid="true"]{border-color:var(--bad)}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand2);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand2) 18%,transparent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.tot{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-variant-numeric:tabular-nums}
.tot.big{font-weight:800;font-size:18px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.tot.muted{color:var(--muted)}
.ohead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.day{font-size:13.5px;font-weight:800;color:var(--muted);margin:16px 2px 0}
.day:first-child{margin-top:0}
.empty{color:var(--muted);text-align:center;padding:26px 16px;background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-12px);background:var(--hero);color:var(--hero-ink);padding:12px 18px;border-radius:var(--r-p);font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity var(--dur-short),transform var(--dur-short);z-index:30;max-width:calc(100% - 32px);box-shadow:var(--shadow-g)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.banner{border-radius:16px;padding:11px 14px;font-size:13.5px;font-weight:600;margin-bottom:12px}
.banner.info{background:var(--info-bg);color:var(--info)} .banner.warn{background:var(--warn-bg);color:var(--warn)} .banner.bad{background:var(--bad-bg);color:var(--bad)}
.menu{display:flex;flex-direction:column;background:var(--surface);border:0;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.menu button,.menu a{display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;font-weight:700;text-decoration:none;color:var(--ink);transition:background-color var(--dur-micro)}
.menu button:active,.menu a:active{background:var(--surface-2)}
.menu > :last-child{border-bottom:0}
.menu svg{color:var(--accent);flex:none}
.menu .wmain small{font-weight:400}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;padding:8px 0 0;border-bottom:1px solid var(--line)}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bars i{display:block;width:100%;background:var(--brand2);border-radius:5px 5px 1px 1px;min-height:2px;opacity:.85}
.barlbl{display:flex;gap:3px;font-size:10.5px;color:var(--muted);margin-top:4px}
.barlbl span{flex:1;text-align:center;min-width:0;overflow:hidden;white-space:nowrap}
.hbar{height:8px;background:var(--surface-2);border-radius:var(--r-p);overflow:hidden;margin-top:6px}
.hbar i{display:block;height:100%;background:var(--brand2);border-radius:var(--r-p)}
.hbar i.bad{background:var(--bad)} .hbar i.warn{background:var(--warn)}
.tbl{overflow-x:auto;background:var(--surface);border:0;border-radius:var(--r);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
.brand{display:flex;align-items:center;gap:10px;margin:28px 0 8px}
.brand .logo{width:54px;height:54px;display:block;flex:none}
.brand .logo svg{width:100%;height:100%;display:block}
.brand b span{color:var(--brand2);font-weight:600}
.brand b em{font-style:normal;font-weight:600;font-size:.55em;color:var(--muted);letter-spacing:0;margin-left:2px}
.brand b{font:800 30px/1 var(--body);letter-spacing:-.03em}
.lead{font-size:16px;color:var(--muted);margin:6px 0 22px;max-width:36ch}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}
.feat div{background:var(--surface);border:0;border-radius:18px;padding:13px;font-size:13px;color:var(--muted);box-shadow:var(--shadow)}
.feat b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.code{font:600 28px/1 var(--mono);letter-spacing:.18em;color:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-weight:600}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.demo-tag{display:inline-block;background:var(--primary);color:var(--primary-ink);font-size:11px;font-weight:800;border-radius:var(--r-p);padding:2px 9px;vertical-align:middle;margin-left:6px}
/* Inventário: cinza escuro = falta contar, verde = contado */
.irow{display:grid;grid-template-columns:24px 1fr 42px 84px;gap:8px;align-items:center;padding:10px 10px 10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;transition:background .25s,border-color .25s}
.irow input{font:600 16px var(--body);text-align:center;border:1px solid var(--line);border-radius:10px;padding:9px 6px;background:var(--bg);color:var(--ink);width:100%}
.irow .ist{width:24px;height:24px;border-radius:99px;display:grid;place-items:center}
.irow .iok{width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center}
.irow.pend{background:var(--inv-pend);border-color:var(--inv-pend);color:var(--inv-pend-ink)}
.irow.pend .wmain small{color:color-mix(in srgb,var(--inv-pend-ink) 72%,transparent)}
.irow.pend .ist{border:2px solid color-mix(in srgb,var(--inv-pend-ink) 50%,transparent)}
.irow.pend .iok{background:var(--veu-2);border-color:var(--veu-3);color:var(--on-dark)}
.irow.pend input{background:var(--white);color:var(--primary-ink);border-color:transparent}
.irow.pend input::placeholder{color:var(--inv-pend-ph)}
.irow.ok{background:var(--good-bg);border-color:var(--good)}
.irow.ok .ist{background:var(--good);color:var(--surface)}
.irow.ok .iok{color:var(--good);border-color:var(--good)}
.irow.ok input{border-color:var(--good)}
.irow .idf{color:var(--warn);font-weight:700}
.irow.flash{box-shadow:0 0 0 3px var(--accent)}
.invleg{padding:1px 6px;border-radius:6px;font-weight:700}
.invleg.pend{background:var(--inv-pend);color:var(--inv-pend-ink)} .invleg.ok{background:var(--good-bg);color:var(--good)}
.invprog{background:var(--surface);border:0;box-shadow:var(--shadow);border-radius:18px;padding:12px 14px;margin-bottom:10px;font-size:14px}
.invprog .bar{height:8px;border-radius:99px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.invprog .bar i{display:block;height:100%;background:var(--good);border-radius:var(--r-p)}
/* Movimentos de estoque (tipo MB51) */
.mvq{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.mvsaldo{font-size:12px;color:var(--muted);display:block;text-align:right}
.tbl td.mvdoc{white-space:nowrap}
.crow{display:grid;grid-template-columns:1fr 70px 96px 30px;gap:8px;align-items:center;padding:10px;background:var(--surface);border:0;box-shadow:var(--shadow);border-radius:18px}
.crow input{font:500 15px var(--body);border:1px solid var(--line);border-radius:10px;padding:8px 6px;background:var(--bg);color:var(--ink);width:100%;text-align:right}
.crow b{font-size:14px;line-height:1.25;display:block}
.crow small{font-size:12px;color:var(--muted)}
.xbtn{border:0;background:transparent;color:var(--muted);font-size:20px;padding:0}

.iconbtn.sm{width:40px;height:40px}
.hdr-actions{display:flex;gap:8px;align-items:center;flex:none}
.search .scanbtn{border:0;background:var(--accent-soft);color:var(--accent);width:36px;height:36px;border-radius:var(--r-p);display:grid;place-items:center;flex:none;margin-right:-6px}
.inline-scan{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.inline-scan .btn{height:48px}
#scanner{position:fixed;inset:0;background:var(--black);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center}
#scanner[hidden]{display:none}
#scanner video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
#scanner .frame{position:relative;width:min(78vw,340px);height:160px;border:3px solid var(--on-dark);border-radius:18px;box-shadow:0 0 0 2000px color-mix(in srgb,var(--black) 45%,transparent)}
#scanner .scan-hint{position:absolute;bottom:calc(110px + env(safe-area-inset-bottom));color:var(--on-dark);font-weight:700;text-align:center;width:100%;padding:0 20px}
#scanner .btn{position:absolute;bottom:calc(40px + env(safe-area-inset-bottom))}
.nfrow .mini a{font-size:13px}
.theme-seg,.idioma-seg{margin-top:8px}
.plan{display:flex;align-items:center;gap:10px;justify-content:space-between}
.chk{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.chk:last-child{border-bottom:0}
.chk b{display:block}
.chk small{color:var(--muted)}
.chk .pill{margin-left:auto}
.legal{font-size:14px;line-height:1.6}
.legal h3{font-size:15px;margin:18px 0 6px}
.quick.one{grid-template-columns:1fr}

.busy{opacity:.55;pointer-events:none;cursor:progress}

/* Categorias de produto */
.catrow{padding:8px 8px 8px 12px}
.catrow .catmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:4px 0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.catrow .ord{display:flex;gap:6px;flex:none}
.catrow.arq .catmain{opacity:.55}
.catdot{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px var(--hair)}
.cores{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 14px}
.cores button{width:36px;height:36px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px var(--hair)}
.cores button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--surface)}

/* ===== Telas maiores =====
   Celular (< 640px): nada muda. Tablet (>= 640px): coluna mais larga, rejilha de cartões e listas em duas colunas.
   Computador (>= 1000px): barra lateral no lugar das abas, conteúdo largo, janelas no centro da tela.
   A classe r-<rota> no #app deixa a largura do conteúdo depender da tela (lista larga, formulário estreito). */
@media (min-width:640px){
  .app{max-width:760px;padding-left:24px;padding-right:24px}
  .app.bare{max-width:460px;padding-left:16px;padding-right:16px}
  .tabbar,.ofoot{max-width:760px}
  .ofoot{width:calc(100% - 48px)}
  #sheet{max-width:560px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .list{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));display:grid}
  .list > :not(.row):not(.irow):not(.crow){grid-column:1/-1}
  .top > .hdr-actions{flex:none;margin-left:auto}
}
/* Computador: sistema de gestão de verdade. Barra lateral azul-marinho com todas as áreas, cabeçalho fixo,
   tabelas no lugar das listas de cartões e telas de detalhe em duas colunas (views.js usa DESK()). */
@media (min-width:1000px) and (min-height:520px){
  :root{--side:252px}
  body{background:var(--bg);font-size:14.5px}
  .tabbar.side{left:0;top:0;bottom:0;transform:none;width:var(--side);max-width:none;display:flex;flex-direction:column;gap:0;padding:18px 14px 14px;border:0;border-radius:0;box-shadow:none;background:var(--side-bg);color:var(--side-ink);overflow-y:auto;z-index:6;scrollbar-width:thin}
  .tabbar.side button > svg{padding:0;background:none!important;color:inherit!important}
  .tabbar.side button{flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;width:100%;padding:9px 14px;border-radius:var(--r-p);font-size:14px;font-weight:700;color:var(--side-ink);text-align:left;position:relative}
  .tabbar.side button:hover{background:var(--side-hi);color:var(--on-dark)}
  .tabbar.side button[aria-current="page"]{background:var(--side-on);color:var(--on-dark);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--mint) 40%,transparent)}
  .tabbar.side button svg{flex:none;opacity:.9}
  .sn-brand{display:flex;align-items:center;gap:9px;padding:2px 8px 18px}
  .sn-brand svg{width:34px;height:34px;flex:none}
  .sn-brand b{font:800 21px/1 var(--body);letter-spacing:-.03em;color:var(--on-dark)}
  .sn-brand b span{color:var(--mint);font-weight:600}
  .sn-brand .demo-tag{margin-left:auto}
  .tabbar.side .sn-new{justify-content:center;background:var(--primary);color:var(--primary-ink);padding:12px;border-radius:var(--r-p);font-size:14.5px;font-weight:800;margin-bottom:10px;box-shadow:0 3px 0 var(--primary-edge)}
  .tabbar.side .sn-new:hover{background:var(--primary-hi);color:var(--primary-ink)}
  .tabbar.side .sn-new:active{transform:translateY(3px);box-shadow:none}
  .sn-nav{display:flex;flex-direction:column;gap:2px;flex:1}
  .sn-sec{margin:18px 14px 6px;font-size:12.5px;font-weight:700;color:var(--on-dark-3)}
  .tabbar.side .sn-me{margin-top:14px;padding:10px;border-top:1px solid var(--veu-1);border-radius:18px;gap:10px}
  .sn-me .avatar{background:var(--side-on);color:var(--mint)}
  .sn-me .wmain b{font-size:13.5px;color:var(--on-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sn-me .wmain small{font-size:12px;color:var(--on-dark-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}

  .app{max-width:none;margin:0 0 0 var(--side);box-shadow:none;padding:0 36px 72px;min-height:100vh}
  .app.with-foot{padding-bottom:120px}
  #main{max-width:1480px}
  .app.r-mais #main,.app.r-empresa #main,.app.r-equipe #main,.app.r-fiscal #main,.app.r-conta #main,.app.r-termos #main,.app.r-importar #main,
  .app.r-categorias #main,.app.r-inventario #main,.app.r-compra #main{max-width:880px}
  .top{position:sticky;top:0;z-index:4;margin:0 -36px 22px;padding:18px 36px 14px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);min-height:84px}
  h1{font-size:30px}
  h1.sm{font-size:26px}
  .eyebrow{font-size:12.5px}
  .top .btn.sm{padding:9px 14px;font-size:13.5px}
  .top .btn.sm.line{background:var(--surface)}
  .top .btn.sm svg{width:16px;height:16px}
  .banner{margin-bottom:16px}

  /* busca e filtros numa linha */
  .toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .toolbar .search{flex:0 1 360px;margin:0!important}
  .toolbar .search input{padding:10px 0;font-size:14.5px}
  .toolbar .chips{padding:0;flex-wrap:wrap;overflow:visible;flex:1}
  .chip{padding:6px 13px;font-size:13px}

  /* tabelas */
  .dtable{background:var(--surface);border:0;border-radius:var(--r);overflow-x:auto;box-shadow:var(--shadow)}
  .dtable table{width:100%;border-collapse:collapse;font-size:14px}
  .dtable th{text-align:left;font-size:13px;font-weight:700;color:var(--muted);padding:11px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
  .dtable td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
  .dtable tbody tr:last-child td{border-bottom:0}
  .dtable tbody tr{cursor:pointer}
  .dtable tbody tr.static{cursor:default}
  .dtable tbody tr.static:hover{background:transparent}
  .dtable .mini{display:inline-flex;gap:6px;margin:0}
  #main > .seg{max-width:560px}
  .dtable tbody tr:hover{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
  .dtable tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .dtable tr.off{opacity:.5}
  .dtable .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .dtable .muted{color:var(--muted)}
  .dtable .strong{font-weight:600}
  .dtable .nowrap{white-space:nowrap}
  .dtable td small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
  .dtable td.num small{display:inline;margin-left:6px}
  .dtable td b{font-weight:700}
  .pcell{display:flex;align-items:center;gap:12px;min-width:0}
  .pcell .bt{width:30px;height:38px;border-radius:8px}
  .pcell .bt svg{height:30px}
  .pcell b{display:block}
  .cat{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .cat i{width:8px;height:8px;border-radius:50%;display:block}
  .summary{margin:12px 2px 10px}

  /* início */
  .kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:0}
  .stat{padding:16px 18px;border-radius:var(--r)}
  .stat b{font-size:23px}
  .stat em{display:block;font-style:normal;font-size:12px;font-weight:700;margin-top:6px}
  .stat em.up{color:var(--good)} .stat em.down{color:var(--bad)}
  .stat.kpi-main{background:radial-gradient(circle at calc(100% + 26px) -26px,var(--primary) 0 64px,transparent 65px),var(--hero);border-color:transparent;color:var(--hero-ink);box-shadow:var(--shadow-g)}
  .stat.kpi-main span,.stat.kpi-main small{color:var(--on-dark-2)}

  .dash{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:16px;margin-top:16px;align-items:start}
  .dcol{display:flex;flex-direction:column;gap:16px;min-width:0}

  .bars{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:6px}

  .bar small{font-size:11px;color:var(--muted);white-space:nowrap}
  .qlist{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  .panel .list{display:flex;gap:0}
  .panel .row{border:0;border-radius:0;box-shadow:none;border-bottom:1px solid var(--line);padding:10px 0;background:transparent}
  .panel .row:last-child{border-bottom:0}
  .panel .row .dot,.panel .row .bt{width:34px;height:34px;border-radius:10px}
  .panel .row .bt svg{height:28px}
  .panel .wmain b{font-size:14px}

  /* duas colunas */
  .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,360px);gap:22px;align-items:start}
  .split.novo{grid-template-columns:minmax(0,1fr) minmax(340px,400px)}
  .col-side{display:flex;flex-direction:column;gap:0}
  .col-main > :first-child,.col-side > :first-child{margin-top:0}
  .col-side .card{margin-top:0!important}
  .col-side .sec:first-child{margin-top:0}
  .col-side .quick{grid-template-columns:1fr 1fr;margin-top:0}
  .col-side .btns{grid-template-columns:1fr}
  .col-side .specs{grid-template-columns:1fr}
  .col-main .list{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
  .kpis-row{display:grid;grid-template-columns:minmax(240px,1.1fr) 3fr;gap:14px;margin-bottom:18px}
  .kpis-row .stats{margin-top:0;grid-template-columns:repeat(4,1fr)}
  .kpis-row .hero{border-radius:var(--r)}
  .split.novo .col-main > .lbl:first-child{margin-top:0!important}

  .list{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
  .stats{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

  .ofoot{left:var(--side);right:0;bottom:0;transform:none;width:auto;max-width:none;border-radius:0;padding:12px 36px 12px calc(36px + 0px);justify-content:flex-end;gap:28px;background:var(--surface);color:var(--ink);border-top:0;box-shadow:var(--shadow-g)}

  .app.bare{max-width:460px;margin:48px auto;min-height:0;border-radius:36px;box-shadow:var(--shadow-g);padding:20px 24px 40px}
  /* entrada: os mesmos discos menta e doce de leite da landing */
  body:has(#app.bare){background:radial-gradient(circle at 100% 0%,var(--mint) 0 300px,transparent 301px),radial-gradient(circle at 0% 100%,var(--primary) 0 220px,transparent 221px),var(--bg)}
  .app.bare .top{position:static;margin:0 0 14px;padding:0;border:0;background:none;min-height:0}

  #sheet{left:50%;top:50%;bottom:auto;max-width:620px;max-height:88vh;border-radius:30px;padding:22px 26px 26px;transform:translate(-50%,-46%) scale(.97);opacity:0;box-shadow:var(--shadow-g);transition:transform .22s,opacity .22s,visibility 0s .22s}
  #sheet.open{transform:translate(-50%,-50%) scale(1);opacity:1;transition:transform .22s,opacity .22s}
  .handle{display:none}

  .row:hover,button.stat:hover{border-color:var(--hair)}
  .stat.kpi-main:hover{border-color:transparent}
  .menu button:hover,.menu a:hover{background:var(--surface-2)}
  .chip:hover:not([aria-pressed="true"]){border-color:var(--hair)}
  .quick button:hover,.quick a:hover{border-color:var(--hair)}
}
/* Notebook (1000 a 1279px): menos espaço, então barra mais estreita e colunas secundárias escondidas */
@media (min-width:1000px) and (max-width:1279px) and (min-height:520px){
  :root{--side:224px}
  .app{padding:0 26px 72px}
  .top{margin:0 -26px 20px;padding:18px 26px 14px}
  .ofoot{padding:12px 26px}
  .stat{padding:14px}
  .stat b{font-size:20px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
  .dash{grid-template-columns:minmax(0,1fr) 300px}
  .bar:nth-child(even) small{visibility:hidden}
  .t-prod td.num small{display:none}
  .kpis-row{grid-template-columns:1fr}
  .split{grid-template-columns:minmax(0,1fr) 300px;gap:18px}
  .split.novo{grid-template-columns:minmax(0,1fr) 330px}
  .t-ped th:nth-child(5),.t-ped td:nth-child(5),.t-ped th:nth-child(6),.t-ped td:nth-child(6),
  .t-prod th:nth-child(3),.t-prod td:nth-child(3),.t-comp th:nth-child(4),.t-comp td:nth-child(4),.t-comp th:nth-child(5),.t-comp td:nth-child(5){display:none}
  .dtable th,.dtable td{padding-left:11px;padding-right:11px}
}
